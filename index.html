<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equif="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"</link>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 bg-white">
        <div class="text-dark text-nowrap d-flex flex-column">
        <h1>PASSWORD GENERATOR</h1>
        <div class="d-flex flex-column gap-1 mt-2">
        <label for="passwordLength" class="fw-medium">Password Length</label>
        <input class="form-control" id="passwordLength" type="number">
        <label for="password" class="fw-medium">Password</label>
        <input class="form-control form-control-lg" id="password" type="password" readonly></input>
        </div>
        <button class="btn btn-success fw-medium btn-lg mt-2" onclick="getPassword()">Generate</button>
        <button class="btn btn-primary fw-medium btn-lg mt-2" onclick="savePassword()">Save</button>
        </div>
    </div>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
